# Copy to database.yml (gitignored) and adjust username for your machine.
# Local Postgres 16 example:
#   username: postgres
#   host: localhost

common: &common
  adapter: postgresql
  encoding: utf8
  username: postgres
  password:
  host: localhost

development:
  <<: *common
  database: wulin_agent_development

test: &test
  <<: *common
  database: wulin_agent_test

production:
  <<: *common
  database: wulin_agent
