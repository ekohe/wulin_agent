image: ruby:3.4.3

services:
  - postgres:latest

variables:
  POSTGRES_DB: wulin_agent_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ""
  POSTGRES_HOST_AUTH_METHOD: trust

cache:
  key:
    files:
      - Gemfile.lock
      - app/package-lock.json
  paths:
    - vendor/bundle
    - app/node_modules

stages:
  - test

before_script:
  - apt-get update -qy
  - apt-get install -qy git nodejs npm libfontconfig1 libpq-dev

  # Keep credentials in the job environment, outside the cached repositories.
  # The dependency projects must allow this project to use CI_JOB_TOKEN.
  - |
    test -n "${CI_JOB_TOKEN:-}"
    export GIT_CONFIG_COUNT=1
    export GIT_CONFIG_KEY_0="url.https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/.insteadOf"
    export GIT_CONFIG_VALUE_0="git@${CI_SERVER_HOST}:"

  # gems
  - gem install bundler -v 2.6.9
  - cp spec/dummy/config/database.ci.yml spec/dummy/config/database.yml
  - mkdir -p vendor/bundle
  - bundle config set path vendor/bundle
  - bundle check || bundle install --jobs 8

  # frontend
  - npm ci
  - (cd app && npm ci && npm run build)

rspec:
  stage: test
  script:
    - bundle exec rake app:db:test:prepare
    - bundle exec rspec
