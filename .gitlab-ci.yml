image: ruby:3.4.3

services:
  - postgres:latest

variables:
  POSTGRES_DB: wulin_agent_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ""
  POSTGRES_HOST_AUTH_METHOD: trust

cache:
  key:
    files:
      - Gemfile.lock
      - spec/dummy/package-lock.json
  paths:
    - vendor/bundle
    - spec/dummy/node_modules

stages:
  - test

before_script:
  - apt-get update -qy
  # postgresql-client: the dummy schema is structure.sql, loaded with psql
  - apt-get install -qy git curl gnupg libfontconfig1 libpq-dev postgresql-client
  # Node 22 from NodeSource, as wulin_master's base image installs it; Debian ships an older one.
  - |
    mkdir -p /etc/apt/keyrings
    curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
    echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main" > /etc/apt/sources.list.d/nodesource.list
    apt-get update -qy
    apt-get install -qy nodejs
    node --version

  # gems
  - gem install bundler -v 2.6.9
  - cp spec/dummy/config/database.ci.yml spec/dummy/config/database.yml
  - mkdir -p vendor/bundle
  - bundle config set path vendor/bundle
  - bundle check || bundle install --jobs 8

  # frontend: the dummy host bundles wulin_agent from source, as a v3 app does
  - spec/dummy/bin/build-assets

rspec:
  stage: test
  script:
    - bundle exec rake app:db:test:prepare
    - bundle exec rspec

# Gems only: linting needs neither Node, the assets nor the database.
standardrb:
  stage: test
  services: []
  before_script:
    - apt-get update -qy
    - apt-get install -qy libpq-dev
    - gem install bundler -v 2.6.9
    - bundle config set path vendor/bundle
    - bundle check || bundle install --jobs 8
  script:
    - bundle exec standardrb
